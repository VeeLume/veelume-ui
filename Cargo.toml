# Virtual workspace root — lets cargo, just and the git hooks run from the repo
# root while the only Rust crate lives at apps/demo/src-tauri.
#
# Hand-written rather than generated: template-tauri was scaffolded into
# apps/demo with `workspace=false` precisely so it would NOT create a second
# workspace root there. Same shape as stibu-workspace.
[workspace]
resolver = "2"
members = ["apps/demo/src-tauri"]

# Profiles must live at the workspace root — profiles in a member manifest are
# ignored (with a warning).
[profile.dev]
incremental = true

# The demo crate holds the 1.5M-row stress dataset. Unoptimised, its full scan
# costs ~1.5s where release costs ~100ms — which makes every /stress number in
# `tauri dev` a debug-build artefact ("measure the artefact that actually
# fails"). Optimising just this crate keeps dep compile times untouched.
[profile.dev.package.veelume-ui-demo]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
