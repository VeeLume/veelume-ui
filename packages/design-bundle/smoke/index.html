<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>design-bundle smoke</title>
		<link rel="stylesheet" href="palette.css" />
		<link rel="stylesheet" href="../dist/Starlume/bundle.css" />
		<script src="../node_modules/react/umd/react.production.min.js"></script>
		<script src="../node_modules/react-dom/umd/react-dom.production.min.js"></script>
		<script src="../dist/Starlume/bundle.js"></script>
	</head>
	<body>
		<div
			id="root"
			style="padding: 24px; display: flex; flex-direction: column; gap: 16px; width: 640px"
		></div>
		<script>
			// Mounts every bridged component the way a canvas does, then clicks each
			// one and checks the change reaches React. run.mjs reads window.__smoke.
			const h = React.createElement;
			const S = window.Starlume;
			const seen = { save: false, ore: null };
			function App() {
				const [ore, setOre] = React.useState('Agricium');
				seen.ore = ore;
				return h(
					'div',
					{ style: { display: 'flex', flexDirection: 'column', gap: 16 } },
					h(
						'div',
						{ style: { display: 'flex', gap: 8 } },
						h(S.Button, { variant: 'primary', onClick: () => (seen.save = true) }, 'Save'),
						h(S.Button, { variant: 'outline' }, 'Save as new'),
						h(S.Button, { variant: 'ghost' }, 'Revert')
					),
					h(S.Segmented, { options: 'By ore, By place' }),
					h(S.Select, {
						label: 'Ore',
						options: ['Agricium', 'Beryl', 'Gold', 'Quantainium'],
						value: ore,
						onChange: setOre
					}),
					h(S.Switch, { label: 'Start with Windows' }),
					h(S.RadioGroup, { label: 'Group by', options: 'Ship, Place' })
				);
			}
			ReactDOM.createRoot(document.getElementById('root')).render(h(App));

			const wait = (ms) => new Promise((r) => setTimeout(r, ms));
			const button = (text) =>
				[...document.querySelectorAll('button')].find((b) => b.textContent.trim() === text);
			window.__smoke = (async () => {
				const checks = {};
				await wait(150);
				checks.namespace = Object.keys(S).join(',');
				const seg = button('By place');
				seg.click();
				await wait(60);
				checks.segmented = seg.getAttribute('aria-pressed') === 'true';
				const sw = document.querySelector('[role="switch"]');
				sw.click();
				await wait(60);
				checks.switch = sw.getAttribute('aria-checked') === 'true';
				[...document.querySelectorAll('button')]
					.find((b) => b.textContent.includes('Agricium'))
					.click();
				await wait(120);
				checks.selectOptions = document.querySelectorAll('[role="option"]').length;
				[...document.querySelectorAll('[role="option"]')]
					.find((o) => o.textContent.includes('Gold'))
					.click();
				await wait(120);
				checks.selectValue = seen.ore;
				button('Save').click();
				await wait(30);
				checks.buttonClick = seen.save;
				checks.radios = document.querySelectorAll('input[type=radio]').length;
				return checks;
			})();
		</script>
	</body>
</html>
