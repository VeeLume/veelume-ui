[package]
name = "veelume-ui-demo"
version = "0.1.0"
description = "Demo and validation harness for the veelume-ui kit"
authors = ["Valerie"]
edition = "2021"
# Required because a second [[bin]] (export-bindings) is declared below: without
# it `cargo run` cannot choose a target, and `tauri dev`'s DevCommand is a bare
# `cargo run` — so `just dev` dies with exit 101 on an untouched scaffold.
# Gating that bin behind `required-features` does not help; cargo counts
# declared targets, not buildable ones.
default-run = "veelume-ui-demo"

[[bin]]
name = "veelume-ui-demo"
path = "src/main.rs"

# Dev-only bindings exporter. Behind a non-default feature so `cargo build` and
# `tauri build` skip it — Tauri compiles every [[bin]] and bundles it into the
# installer otherwise (tauri-apps/tauri#7592). Kept a [[bin]] rather than an
# example so it links beside the WebView2 DLLs the lib needs at load time.
[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"
required-features = ["bindgen"]

# The HTTP + SSE backend — the demo's second transport. Same `required-features`
# reasoning as above: Tauri compiles and bundles every [[bin]] it can build, and
# an app installer has no business shipping a web server.
[[bin]]
name = "demo-server"
path = "src/bin/serve.rs"
required-features = ["serve"]

[lib]
# `_lib` suffix: on mobile the app is a cdylib and the bin name would collide.
name = "veelume_ui_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
bindgen = []
# Pulls in the whole HTTP stack, so it stays off for `tauri dev` / `tauri build`.
serve = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:tokio-stream"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Typed IPC: every #[specta::specta] command is exported to src/lib/bindings.ts
# on debug builds. Pinned — the rc versions of these three must agree.
specta = "=2.0.0-rc.22"
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }

# The `serve` feature only. Optional so a Tauri build never sees them.
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"], optional = true }
tokio-stream = { version = "0.1", features = ["sync"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }

# Desktop-only: the signed auto-updater and the relaunch that follows it.
# Mobile has no Tauri updater (Android ships its own APK flow).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
